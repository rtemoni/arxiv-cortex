services:
  arxiv-cortex:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARXIV_CORTEX_PORT:-5000}:5000"
    environment:
      ARXIV_CORTEX_DATA_DIR: /data
      HF_HOME: /models/huggingface
    volumes:
      - ./data:/data
      - model-cache:/models

volumes:
  model-cache:
